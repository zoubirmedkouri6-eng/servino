<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Servino – Études à l'étranger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fffdf8;--bg2:#fdf3d8;--ink:#1f1d19;--mute:#5d584d;--line:#eadfc3;--gold:#f0b429;--gt:#9a6a00;--dark:#16171a;
--serif:"Cormorant Garamond",Georgia,serif;--sans:"Manrope",system-ui,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:inherit}
body{position:relative;margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.65 var(--sans)}
a{color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
.banner{position:relative;z-index:1;background:var(--gold);color:#1f1d19;font-size:.9rem;text-align:center;padding:9px 16px}
.banner span{font-weight:700;white-space:pre-wrap}
.banner a{color:#1f1d19;font-weight:700;margin-left:14px;text-decoration:underline}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header.stuck{background:rgba(255,253,248,.94);border-bottom-color:var(--line);backdrop-filter:blur(8px)}
header .wrap{display:flex;align-items:center;gap:20px;height:68px}
.brand{font:700 1.6rem/1 var(--serif);letter-spacing:.06em;text-decoration:none;margin-right:auto}
.brand b{color:var(--gt)}
nav{display:flex;gap:26px;font-size:.95rem;font-weight:600}
nav a{text-decoration:none}
nav a:hover{color:var(--gt)}
.lang{display:flex;border:1px solid var(--ink);border-radius:999px;overflow:hidden}
.lang button{font:700 .8rem var(--sans);background:none;border:0;color:var(--ink);padding:6px 12px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
button:focus-visible,a:focus-visible{outline:2px solid var(--gt);outline-offset:2px}
.hero{position:relative;z-index:1;padding:clamp(230px,32vw,320px) 0 40px}
.hero h1,.hero p{text-shadow:0 0 18px var(--bg),0 0 8px var(--bg)}
.hero h1{font:800 clamp(2rem,5vw,3.4rem)/1.1 var(--sans);margin:0 0 18px;max-width:20ch;letter-spacing:-.02em}
.hero p{color:var(--mute);font-size:1.1rem;max-width:58ch;margin:0 0 28px}
.btns{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-block;padding:13px 26px;border-radius:999px;font-weight:700;text-decoration:none;border:2px solid var(--ink)}
.btn.gold{background:var(--ink);color:var(--bg)}
.btn.line{color:var(--ink)}
section{padding:64px 0}
h2{font:800 clamp(1.6rem,3.4vw,2.2rem)/1.15 var(--sans);margin:0 0 12px;letter-spacing:-.01em}
.lead{color:var(--mute);margin:0 0 30px;max-width:60ch}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
.tabs button{font:700 .95rem var(--sans);background:none;color:var(--ink);border:2px solid var(--line);border-radius:999px;padding:9px 22px;cursor:pointer}
.tabs button[aria-selected="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.panel{background:var(--bg2);border-radius:6px;padding:30px clamp(20px,4vw,40px)}
.panel h3{font:800 1.5rem/1.2 var(--sans);margin:0 0 6px}
.panel .intro{color:var(--mute);margin:0 0 20px}
dl{margin:0;display:grid;grid-template-columns:minmax(120px,210px) 1fr;gap:0 24px}
dt{font-weight:700;padding:12px 0;border-top:1px solid var(--line)}
dd{margin:0;padding:12px 0;border-top:1px solid var(--line)}
.panel .btn{margin-top:22px}
.steps{list-style:none;padding:0;margin:0;max-width:760px}
.steps li{display:grid;grid-template-columns:48px 1fr;gap:4px 16px;padding:20px 0;border-top:1px solid var(--line)}
.steps span{grid-row:span 2;width:40px;height:40px;border-radius:50%;background:var(--gold);color:#16171a;font-weight:800;display:flex;align-items:center;justify-content:center}
.steps h3{margin:0;font:700 1.1rem var(--sans)}
.steps p{margin:0;color:var(--mute)}
.alt{background:var(--bg2)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:24px}
.card{background:var(--bg);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.card i{display:block;height:6px;background:linear-gradient(90deg,#fde08a,#f0b429)}
.card div{padding:20px}
.card h3{font:800 1.15rem/1.25 var(--sans);margin:0 0 8px}
.card p{margin:0 0 14px;color:var(--mute)}
.card a{font-weight:700;color:var(--gt)}
.ask{background:linear-gradient(135deg,#fde08a,#f0b429);color:#1f1d19;text-align:center;padding:64px 0}
.ask h2{color:#1f1d19}.ask p{color:#3a3528;margin:0 0 24px}
.ask .btn{background:#1f1d19;border-color:#1f1d19;color:#fff}
footer{background:var(--bg2);color:var(--mute);padding:44px 0 28px;font-size:.92rem}
.fcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:28px;margin-bottom:28px}
footer h4{margin:0 0 8px;color:var(--gt);font:700 1rem var(--sans)}
footer p{margin:0}
footer .copy{border-top:1px solid var(--line);padding-top:18px;font-size:.82rem}
@media(max-width:700px){nav{display:none}dl{grid-template-columns:1fr}dt{border-bottom:0;padding-bottom:0}dd{border-top:0;padding-top:2px}.hero{padding-bottom:28px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
.fl{width:26px;height:17px;border-radius:2px;vertical-align:-3px;margin-right:8px;box-shadow:0 0 0 1px rgba(0,0,0,.18)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.tile{position:relative;border:0;padding:0;border-radius:10px;overflow:hidden;cursor:pointer;background:none;font:inherit;color:var(--ink);box-shadow:0 2px 10px rgba(154,106,0,.18)}
.tile span{position:absolute;left:0;right:0;bottom:0;padding:22px 12px 10px;display:flex;align-items:center;font-weight:800;background:linear-gradient(transparent,rgba(255,253,248,.96) 65%)}
.panel h3 .fl{width:30px;height:20px}
.bgimg{position:absolute;left:0;right:0;top:calc(0px - env(safe-area-inset-top,0px));height:560px;z-index:0;pointer-events:none;

var lang="fr",cur=0;
var KEYS=["cost","living","adm","intake","visa","work","extra"];
function render(){
  var i=lang==="fr"?0:1,t=T[lang];
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-i18n]").forEach(function(e){e.textContent=t[e.getAttribute("data-i18n")]});
  document.getElementById("bFr").setAttribute("aria-pressed",lang==="fr");
  document.getElementById("bEn").setAttribute("aria-pressed",lang==="en");
  var tabs=document.getElementById("tabs");tabs.innerHTML="";
  C.forEach(function(c,k){
    var b=document.createElement("button");b.setAttribute("role","tab");
    b.setAttribute("aria-selected",k===cur);b.innerHTML=F(c.id);b.appendChild(document.createTextNode(c.n[i]));
    b.onclick=function(){cur=k;render()};tabs.appendChild(b);
  });
  var c=C[cur],h="<div class='pimg'>"+A(c.id)+"</div><h3>"+c.n[i]+"</h3><p class='intro'>"+c.intro[i]+"</p><dl>";
  KEYS.forEach(function(k){

    if(v)h+="<dt>"+t[k]+"</dt><dd>"+v+"</dd>";
  });

  document.getElementById("panel").innerHTML=h;

  document.title=lang==="fr"?"Servino – Études à l'étranger":"Servino – Study abroad";
}
function setLang(l){
  lang=l;
  try{localStorage.setItem("servino-lang",l)}catch(e){}

}

document.getElementById("bEn").onclick=function(){setLang("en")};
